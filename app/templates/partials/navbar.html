<header class="topbar">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" type="button" id="sidebarToggle">
            <i class="bi bi-list"></i>
        </button>
        <div>
            <h1 class="page-heading mb-0">{{ page_title|default("Dashboard") }}</h1>
            <small class="text-muted">Structured mock test management and reporting</small>
        </div>
    </div>

    <div class="dropdown">
        <button class="btn profile-chip dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span class="avatar-circle">{{ current_user.username[0]|upper }}</span>
            <span>{{ current_user.username }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
            <li class="dropdown-header">
                <div class="fw-semibold">{{ current_user.email }}</div>
                <small class="text-muted">{{ current_user.role|title }}</small>
            </li>
            <li>
                <a class="dropdown-item" href="{{ url_for('auth.profile') }}">
                    <i class="bi bi-person me-2"></i>Edit Profile
                </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <a class="dropdown-item text-danger" href="{{ url_for('auth.logout') }}">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a>
            </li>
        </ul>
    </div>
</header>
