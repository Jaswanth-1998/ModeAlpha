{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="mb-4 js-flash-stack">
            {% for category, message in messages %}
                <div
                    class="alert alert-{{ category }} alert-dismissible fade show shadow-sm js-auto-dismiss-alert"
                    role="alert"
                    data-dismiss-ms="1000"
                >
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
