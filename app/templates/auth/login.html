{% extends "auth_base.html" %}

{% block title %}Mock-Test | Login{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="mb-4">
        <h2 class="section-title">Login</h2>
        <p class="text-muted mb-0">Use your username or email to access the platform.</p>
    </div>

    <div class="alert alert-info border-0 soft-alert">
        Default admin login: <strong>Admin</strong> / <strong>Admin@123</strong>
    </div>

    <form method="post" class="row g-3">
        <div class="col-12">
            <label class="form-label">Username or Email</label>
            <input type="text" name="login_identifier" class="form-control" placeholder="Enter username or email" required>
        </div>
        <div class="col-12">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <div class="col-12 d-grid">
            <button type="submit" class="btn btn-brand">Login</button>
        </div>
    </form>

    <p class="auth-footnote mb-0">New here? <a href="{{ url_for('auth.register') }}">Create your account</a></p>
</div>
{% endblock %}
